[package]
name = "moekoemusic"
version = "1.7.2"
description = "MoeKoe Music — 酷狗第三方桌面播放器（Tauri 版）"
authors = ["MoeJue"]
license = "GPL-2.0-only"
edition = "2021"
rust-version = "1.77.2"

# 构建产物放在 target（默认）。tauri 编译要求 build.rs 由 tauri-build 处理。
[lib]
name = "moekoemusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 核心
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"         # 外链（mailto/tel/http 外部打开）＋文件打开
tauri-plugin-dialog = "2"         # 原生对话框（日志导出保存、免责声明提示）
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"      # 开机自启
tauri-plugin-process = "2"        # 退出进程（替代 app.exit / quit）
tauri-plugin-deep-link = "2"      # moekoe:// 深链
tauri-plugin-shell = "2"          # sidecar 拉起 / 命令执行
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 日志（替代 electron-log 可看的位置，简单文件日志可选，本轮用 println/存 Tauri 日志）
log = "0.4"
# Windows 专属：托盘/窗口定位默认不需要额外 crate；深链/全局快捷键走插件